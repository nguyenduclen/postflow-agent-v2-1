name: Build PostFlow Agent V2.1 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract V2.1 project
        run: |
          rm -rf build-project
          mkdir -p build-project

          unzip -q postflow-agent-v2.1-github-actions.zip -d build-project

          echo "=== EXTRACTED FILES ==="
          find build-project -maxdepth 5 -type f | sort

      - name: Fix Android resource description
        run: |
          echo "=== FIX ACCESSIBILITY SERVICE XML ==="

          FILE=$(find build-project \
            -type f \
            -path "*/res/xml/accessibility_service_config.xml" \
            -print -quit)

          if [ -z "$FILE" ]; then
            echo "Khong tim thay accessibility_service_config.xml"
          else
            echo "Found: $FILE"

            sed -i -E 's/android:description="[^"]*"//' "$FILE"

            echo "=== FIXED XML ==="
            cat "$FILE"
          fi

      - name: Find Android Gradle project
        run: |
          SETTINGS_FILE=$(find build-project \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Khong tim thay settings.gradle"
            find build-project -maxdepth 6 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: Khong tim thay thu muc app"
            find "$PROJECT_DIR" -maxdepth 3 -type d | sort
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== BUILDING APK ==="
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK KHONG DUOC TAO"
            find app/build -type f | sort
            exit 1
          fi

          echo "=== APK CREATED ==="
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: postflow-agent-v2-1-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14 
